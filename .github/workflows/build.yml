name: Build Backend Module

on:
  push:
    branches: [ main ]   # Runs automatically when you push to main
  pull_request:          # Runs when a PR is opened
  workflow_dispatch:     # Allows manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ✅ Opt into Node.js 24 now

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # OpenJDK distribution
          java-version: '11'        # Match OpenMRS requirements

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Upload omod file
        uses: actions/upload-artifact@v4
        with:
          name: omod
          path: target/*.omod
